<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GenEdit · Terapia génica explicada</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--blk:#111;--bg:#f8f1e7;--card:#fffaf5;--ink:#3a2a28;--mut:#7a625d;--line:#e8d9ca;--ac:#a8472f;--acbg:#fbd9cf;--vi:#a63d68;--vibg:#f9dce6;--wa:#6e4a00;--wabg:#efe0c4;--hd:"Bricolage Grotesque","Trebuchet MS",sans-serif;--bd:"Source Sans 3","Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--blk:#f6e8e0;--bg:#241a19;--card:#2e2220;--ink:#f6e8e0;--mut:#c4aaa2;--line:#47342f;--ac:#f2a08a;--acbg:#4a2a24;--vi:#f4a9c4;--vibg:#4a2434;--wa:#e8cfa0;--wabg:#3d3220}}
:root[data-theme="dark"]{--blk:#f6e8e0;--bg:#241a19;--card:#2e2220;--ink:#f6e8e0;--mut:#c4aaa2;--line:#47342f;--ac:#f2a08a;--acbg:#4a2a24;--vi:#f4a9c4;--vibg:#4a2434;--wa:#e8cfa0;--wabg:#3d3220}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--bd)}
a{color:var(--ac)}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2,h3{font-family:var(--hd);line-height:1.15;margin:0 0 .5em;font-weight:700}
h1{font-size:clamp(2rem,5vw,3.2rem)}h2{font-size:1.6rem}h3{font-size:1.15rem}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.hb{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}.logo img{display:block;height:56px;width:auto}.logo span{font-size:1.6rem;color:var(--blk)}.logo{font:700 1.25rem var(--hd);color:var(--ink);text-decoration:none;margin-right:auto}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:6px 11px;border-radius:8px;text-decoration:none;color:var(--mut);font-size:.95rem}
nav a:hover{background:var(--acbg)}nav a.on{background:var(--acbg);color:var(--ac);font-weight:600}
.srch{display:flex}.srch input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:.9rem;width:150px}
main{padding:28px 0 56px;min-height:60vh}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;padding:12px 0 36px}
.hero p{color:var(--mut);max-width:52ch}
.btn{display:inline-block;background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;font:600 .95rem var(--bd);text-decoration:none;cursor:pointer}
.btn.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink)}
a.card:hover{border-color:var(--ac)}
.card h3{margin:0}.card p{margin:0;color:var(--mut);font-size:.93rem}
.tag{align-self:flex-start;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:6px;background:var(--acbg);color:var(--ac)}
.tag.l{background:var(--wabg);color:var(--wa)}.tag.c{background:var(--vibg);color:var(--vi)}
.meta{font-size:.82rem;color:var(--mut)}
section{margin-top:40px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}.sh h2{margin:0}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.item{border-bottom:1px solid var(--line);padding:10px 0}.item:last-child{border:0}
.deb{background:var(--vibg);border-radius:10px;padding:18px;color:var(--ink)}.deb h3{color:var(--vi)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 13px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.cta{background:var(--acbg);border-radius:10px;padding:22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta h3{margin:0 0 4px}.cta p{margin:0;color:var(--mut)}
.ff{display:flex;gap:8px;flex-wrap:wrap}
input[type=email],textarea,.in{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 12px;font:inherit;width:100%}
.ff input{flex:1;min-width:200px}
article{max-width:68ch}article h2{margin-top:1.6em}
.sum{background:var(--acbg);border-radius:10px;padding:14px 18px;margin:16px 0}
.back{display:inline-block;margin-bottom:14px}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px}
.vote button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;padding:0 8px;font:inherit}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.note{background:var(--wabg);color:var(--wa);border-radius:8px;padding:10px 14px;font-size:.9rem;margin:14px 0}
dl{margin:0}dt{font:700 1.05rem var(--hd);margin-top:16px}dd{margin:4px 0 0;color:var(--mut)}
footer{border-top:1px solid var(--line);background:var(--card);padding:26px 0;font-size:.9rem;color:var(--mut)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px}.fg a{display:block;color:var(--mut);text-decoration:none;padding:2px 0}.fg b{color:var(--ink)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;white-space:pre-wrap}.mini{font-size:.8rem;margin-top:18px}
@media(max-width:720px){.hero,.two{grid-template-columns:1fr}.hero svg{max-height:150px}}
</style>
</head>

function helix(){let a="",b="",r="";for(let i=0;i<=40;i++){const x=20+i*8,y1=100+Math.sin(i/3)*55,y2=100-Math.sin(i/3)*55;a+=(i?"L":"M")+x+" "+y1;b+=(i?"L":"M")+x+" "+y2;if(i%2==0)r+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="var(--line)" stroke-width="2"/>`}return `<svg viewBox="0 0 340 200" role="img" aria-label="Doble hélice de ADN" width="100%">${r}<path d="${a}" fill="none" stroke="var(--ac)" stroke-width="4" stroke-linecap="round"/><path d="${b}" fill="none" stroke="var(--vi)" stroke-width="4" stroke-linecap="round"/></svg>`}

const V={
"":()=>`<div class="hero"><div><h1>La terapia génica, explicada con rigor y sin jerga</h1><p>Analizamos estudios recientes, seguimos la regulación y abrimos el debate para que cualquiera pueda entender hacia dónde va la medicina genética.</p><div class="btns"><a class="btn" href="#/analisis">Leer los análisis</a><a class="btn s" href="#/guia">Empezar por Claves Génicas</a></div></div><div>${helix()}</div></div>

analisis:()=>{const cats=["Todos","Investigación","Ensayos clínicos","Opinión"];return `<h1>Análisis de estudios</h1><p>Artículos científicos recientes, explicados con rigor.</p><div class="chips">${cats.map((c,i)=>`<button class="chip${i?"":" on"}" data-c="${c}">${c}</button>`).join("")}</div><div class="grid" id="lst">${A.map(card).join("")}</div>`},
noticias:()=>`<h1>Noticias y actualidad</h1><p>Aprobaciones, mercado y novedades del sector.</p>${news(N) || '<p class="meta">Todavía no hay noticias publicadas.</p>'}`,
legal:()=>{const laws=(window.GENEDIT_ARTICLES||[]).filter(p=>p.tipo==="ley");return `<h1>Marco legal y ética</h1><p>Patentes, leyes, bioética y acceso a las terapias.</p>${laws.length?`<div class="grid">${laws.map(card).join("")}</div>`:`<div class="grid">${L.map(l=>`<div class="card"><span class="tag l">${l[0]}</span><p>${l[1]}</p></div>`).join("")}</div>`}`},

nosotras:()=>`<h1>Sobre nosotras</h1><article><h2>Nuestra Misión: Ciencia Clara, Sin Prejuicios</h2><p>La terapia génica ya no es ciencia ficción: es una realidad que está reescribiendo la medicina. Sin embargo, el desconocimiento genera dudas, temores y desinformación.</p><p>Como 5 estudiantes de Biotecnología, vivimos de cerca el ritmo de la investigación actual y creemos que el conocimiento científico debe salir de las aulas y los laboratorios para llegar a la sociedad. Nuestro objetivo es acercarte la actualidad científica analizando papers, noticias y leyes sobre terapia génica desde la máxima transparencia, eliminando prejuicios y construyendo una comunidad donde la divulgación y el debate vayan de la mano.</p></article>`,

function mlist(q){const l=MSG.filter(m=>m.q===q);return l.map(m=>`<div class="msg"><b>${esc(m.name)}</b> <span class="meta">${new Date(m.ts).toLocaleDateString("es-ES")}</span><br>${esc(m.text)}</div>`).join("")||'<p class="meta">Aún no hay nada. Sé la primera persona en escribir.</p>'}

async function send(q,text){const m={q,name:store.get("nombre","")||"Visitante",text,ts:Date.now()};if(DB){try{await DB.collection("msgs").add(m);return}catch(e){}}MSG.push(m);store.set("msgs",MSG);paint()}
let MSG=store.get("msgs",[]),DB=null;
(async()=>{try{if(!window.claude)return;DB=await claude.use("db");if(DB){MSG=[];DB.collection("msgs").orderBy("ts").onSnapshot(sn=>{MSG=sn.docs.map(d=>d.data());paint()},()=>{});if(location.hash.indexOf("comunidad")>-1)render()}}catch(e){DB=null}})();
function safeArticleHtml(html){const doc=new DOMParser().parseFromString(String(html||""),"text/html");const allowed=new Set(["P","H2","STRONG","B","EM","I","U","UL","OL","LI","BR","A","BLOCKQUOTE"]);function clean(parent){[...parent.childNodes].forEach(n=>{if(n.nodeType===Node.COMMENT_NODE){n.remove();return}if(n.nodeType!==Node.ELEMENT_NODE)return;if(!allowed.has(n.tagName)){n.replaceWith(...n.childNodes);return}[...n.attributes].forEach(a=>n.removeAttribute(a.name));if(n.tagName==="A"){const raw=n.getAttribute("href");if(raw){try{const u=new URL(raw,location.href);if(["https:","http:"].includes(u.protocol)){n.setAttribute("href",u.href);n.setAttribute("target","_blank");n.setAttribute("rel","noopener noreferrer")}}catch{}}}clean(n)})}clean(doc.body);return doc.body.innerHTML}
function ficha(id){const x=(window.GENEDIT_ARTICLES||[]).find(a=>String(a.id)===decodeURIComponent(id))||A.find(a=>String(a.id)===decodeURIComponent(id));if(!x)return V[""]();const k="com"+id,cs=store.get(k,[]);const body=x.content?safeArticleHtml(x.content):`<p>${esc(x.s||"")}</p>`;const back=x.tipo==="noticia"?"#/noticias":x.tipo==="ley"?"#/legal":"#/analisis";return `<a class="back" href="${back}">← Volver</a><article><span class="tag ${tagc(x.cat)}">${esc(x.cat||x.tipo||"Publicación")}</span><h1>${esc(x.t)}</h1><p class="meta">${esc(x.v||"")} ${x.d?"· "+esc(x.d):""} ${x.f?"· "+esc(x.f):""} · ${x.m||1} min de lectura</p><div class="sum"><b>Resumen</b><p>${esc(x.s||"")}</p></div>${body}${x.fuente_url?`<p class="meta">Fuente: <a href="${esc(x.fuente_url)}" target="_blank" rel="noopener noreferrer">Consultar fuente original</a></p>`:""}<h2>Comentarios</h2><div id="cl">${cs.map(c=>`<div class="item">${esc(c)}</div>`).join("")||'<p class="meta">Sé la primera persona en comentar.</p>'}</div><textarea id="ct" rows="3" placeholder="Escribe tu comentario" aria-label="Comentario"></textarea><p><button class="btn" id="cb" data-k="${k}">Publicar comentario</button></p></article>`}
